name: SDK and audio checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    # Keep the baseline-CPU test on a userland that supports original x86_64.
    runs-on: ubuntu-24.04
    env:
      PLASMO_AUDIO_CACHE: ${{ github.workspace }}/.local/ci-audio
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Install audio build and test tools
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake ninja-build qemu-user
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Source-built DSP and null output, without physical devices
        env:
          ALSOFT_DRIVERS: "null"
        run: cargo test --workspace --locked --test hrtf --test denoise --test device_output -- --ignored
      - name: Codec APIs and baseline CPU without AVX
        run: |
          cargo run --locked -p horizon-plasmo-engine --bin plasmo-voice-runtime -- --check
          qemu-x86_64 -cpu qemu64 target/debug/plasmo-voice-runtime --check
      - name: Missing CMake disables only voice
        env:
          CMAKE: /missing/plasmo-test-cmake
          PLASMO_AUDIO_CACHE: ${{ github.workspace }}/.local/ci-no-cmake
        run: |
          cargo test --workspace --locked --test unavailable
          cargo run --locked -p horizon-plasmo-engine --bin plasmo-voice-runtime -- --expect-disabled missing_cmake
      - name: Check development tools
        run: python3 -m py_compile tools/*.py

  sdk-source-and-package:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch exact reviewed checker
        run: |
          mkdir -p .local/bin
          curl --fail --location --retry 3 'https://github.com/horizon-rust/horizon-mods/releases/download/checker%40f00125f61f794aaa3d4e950d301f353b35b6ee3d/cargo-horizon-mod-f00125f61f794aaa3d4e950d301f353b35b6ee3d' -o .local/bin/cargo-horizon-mod
          echo '2538650e0eb1285edef7775c083b7ca6cbdb82e124934aaa977ddfc02f5078e1  .local/bin/cargo-horizon-mod' | sha256sum --check
          chmod +x .local/bin/cargo-horizon-mod
      - name: Fetch signed SDK and check source-only artifact
        run: python3 tools/package_sdk.py --tool .local/bin/cargo-horizon-mod
      - name: Adapter format
        run: rustfmt --check --edition 2024 mod/src/lib.rs
      - name: Source API regression and independent RSA interoperability
        run: python3 tools/check_sdk.py --interop
      - name: Adapter Clippy
        run: python3 tools/check_sdk.py --clippy
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-source-package
          path: dist/
          if-no-files-found: error

  unsupported-platform:
    runs-on: macos-latest
    env:
      PLASMO_AUDIO_CACHE: ${{ github.workspace }}/.local/ci-audio
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Unsupported target explains why voice is disabled
        run: |
          cargo test --workspace --locked --test unavailable
          cargo run --locked -p horizon-plasmo-engine --bin plasmo-voice-runtime -- --expect-disabled unsupported_target

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Source-built codec, DSP and null-output tests
        shell: pwsh
        run: |
          $mingwBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin'
          $env:Path = $mingwBin + ';' + $env:Path
          $env:CC = Join-Path $mingwBin 'gcc.exe'
          $env:CXX = Join-Path $mingwBin 'g++.exe'
          & $env:CXX --version
          $env:PLASMO_AUDIO_CACHE = Join-Path $env:RUNNER_TEMP 'plasmo-audio'
          $env:ALSOFT_DRIVERS = 'null'
          cargo test --workspace --locked --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked --target x86_64-pc-windows-gnu --test hrtf --test denoise --test device_output -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked --target x86_64-pc-windows-gnu -p horizon-plasmo-engine --bin plasmo-voice-runtime -- --check
          exit $LASTEXITCODE
      - name: Audio build diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'plasmo-audio') -Recurse -Filter audio-build.log | ForEach-Object {
            Write-Output $_.FullName
            Get-Content $_.FullName | Select-Object -Last 80
          }
