[package]
name = "horizon-plasmo-voice"
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rison1337/horizon-plasmo-voice"
description = "Independent Plasmo Voice 2.1 client for the Horizon SDK"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
glam = "0.30"
rsa = { version = "0.10", features = ["pkcs1v15"] }
rand = "0.10"
md5 = "0.7"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

aes = "0.8.4"
cbc = "0.1.2"
getrandom = "0.3"
libloading = "0.8.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sha2 = "0.10.9"
